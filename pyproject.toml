[project]
name = "ledgerly"
version = "0.1.0"
description = "A small invoice and payment service: one request, end to end. FastAPI + SQLAlchemy + Postgres."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "argon2-cffi>=23.1",
  "pyjwt>=2.9",
  "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "httpx>=0.27",
  "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
per-file-ignores = { "tests/*" = ["S101", "S105", "S106"], "scripts/*" = ["S105", "S106"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
